# Every rate, cap, threshold and ID the bot uses lives here.
# Restart the bot after editing. Re-run /setup to refresh the pinned guide.

[server]
guild_id = 1568074109341016135
transactions_channel_id = 1568074193491333271
timezone = "America/New_York"
database_path = "bucks.db"

[economy]
starting_balance = 500
min_account_age_days = 0        # members who joined the server more recently don't earn or receive gifts
currency_suffix = "-bucks"      # default currency name = DisplayName + suffix
currency_name_max_length = 20

[roundup]
hour = 23                       # daily roundup at 11pm (local timezone above)
minute = 0

[soft_cap]
daily_threshold = 3000          # after this much earned in a day...
rate_after = 0.25               # ...all earning is multiplied by this until midnight

[chat]
message_reward = 10
reply_reward = 15
min_message_length = 5
cooldown_seconds = 30           # shared between messages and replies

[reactions]
give_reward = 5                 # for reacting to someone else's message (once per message)
give_daily_limit_per_target = 10   # max paid reactions/day toward any one person
receive_reward = 10             # per unique person who reacts to your message
receive_max_reactors_per_message = 25
receive_daily_limit_per_reactor = 5  # any one reactor pays you at most this many times/day

[voice]
loop_seconds = 60
base_per_minute = 2
camera_bonus = 1
screenshare_bonus = 1
# A session survives a bot restart or brief drop if the member is seen again within this.
session_grace_minutes = 5

# Crowd multiplier: x1.0 below min_people, x(start) at min_people,
# +step per extra person, capped at max.
crowd_min_people = 3
crowd_start = 1.3
crowd_step = 0.1
crowd_max = 2.0

# Duration multiplier: x1.0 for the first hour of a continuous session,
# x(start) after start_hours, +step per extra hour, capped at max.
# Only minutes that actually earned count toward the session length.
duration_start_hours = 1
duration_start = 1.2
duration_step = 0.1
duration_max = 2.3

[safety]
# Circuit breaker: if the bot tries to post more than this many messages in an hour
# (gift announcements, roundups, /setup), it stops posting until the hour has room
# again and DMs the owner. Gifts themselves still go through.
max_posts_per_hour = 60
# Uptime monitor check-in (HEALTHCHECK_URL in .env, optional), every N minutes.
healthcheck_interval_minutes = 5

[speaking]
enabled = true                  # false = bot never joins voice; unmuted-other rule everywhere
window_minutes = 10             # "spoke recently" window
quiet_rate = 0.5                # channel active but this member quiet
# If nobody in the bot's channel has spoken within the window, rate is 0.
# During the bot's first window in a channel (no data yet) the unmuted-other rule applies.
# Talking alone (no one else in the channel) earns nothing.
